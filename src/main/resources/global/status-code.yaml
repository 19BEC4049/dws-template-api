response:
  bad:
    request:
      code: "400"
      message: "Bad request - the request payload or request parameters are invalid"

  not:
    found:
      code: "404"
      message: "Resource not found - the requested API resource or endpoint does not exist"

    acceptable:
      code: "406"
      message: "Not acceptable - the requested response format is not supported"

    implemented:
      code: "501"
      message: "Not implemented - the requested functionality is not currently supported"

  method:
    not:
      allowed:
        code: "405"
        message: "Method not allowed - the HTTP method is not supported for the requested resource"

  unsupported:
    media:
      type:
        code: "415"
        message: "Unsupported media type - the Content-Type or requested media type is not supported"